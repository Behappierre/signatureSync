version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: signatureSync-db-prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-signatureSync}
      POSTGRES_USER: ${POSTGRES_USER:-signatureSync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-signatureSync} -d ${POSTGRES_DB:-signatureSync}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: signatureSync-redis-prod
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - internal

  # Backend API
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: production
    container_name: signatureSync-backend-prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-signatureSync}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-signatureSync}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      FRONTEND_URL: ${FRONTEND_URL:-https://signatureSync.com}
      LOG_LEVEL: ${LOG_LEVEL:-warn}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - internal
      - web

  # Frontend
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: production
    container_name: signatureSync-frontend-prod
    restart: always
    depends_on:
      - backend
    ports:
      - "${PORT:-80}:3000"
    networks:
      - web

  # Nginx reverse proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: signatureSync-proxy
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
    networks:
      - web
    profiles:
      - proxy

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  web:
    external: true
  internal:
    driver: bridge