[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The extract endpoint. Declared here as well as in the function's own
# config so it resolves identically under `netlify dev` and in production.
[[redirects]]
  from = "/api/extract"
  to = "/.netlify/functions/extract"
  status = 200
  force = true

# SPA fallback. Must stay last so it never shadows the API route.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
